name: Feature request
description: Propose a concrete AIBrain improvement.
title: "feature: "
labels: [feature]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe the behavior and success criteria.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
