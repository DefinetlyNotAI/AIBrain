name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install --upgrade pip numpy PySide6 moderngl
      - name: Compile sources
        run: python -m compileall -q cli src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -b
